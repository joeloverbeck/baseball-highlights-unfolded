name: Repository checks
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Pillow
        run: |
          python3 -m venv "$RUNNER_TEMP/check-env"
          "$RUNNER_TEMP/check-env/bin/pip" install Pillow
      - name: Check original cards, design restore, and game-two fixture
        run: |
          "$RUNNER_TEMP/check-env/bin/python" -B -m unittest discover -s tests -v

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.100.0
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo +1.100.0 fmt --check
      - name: Test Buy Round rules and saves
        run: cargo +1.100.0 test --locked --no-default-features
      - name: Typecheck the Ubuntu app
        run: cargo +1.100.0 check --locked --all-targets
